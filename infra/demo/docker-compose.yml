# Temporary demo server: one small VM runs the API and the admin portal behind Caddy (automatic HTTPS).
# The database is hosted elsewhere (see docs/demo.md). Not the production setup (that's infra/azure).
name: shapers-demo

services:
  api:
    image: shapers-api:demo
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
    volumes:
      # Uploaded sermon files and the keys that protect staff sign-in cookies.
      - api-data:/app/App_Data
    # Not published: only Caddy can reach it.
    expose:
      - "8080"
    mem_limit: 640m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  api-data:
  caddy-data:
  caddy-config:
