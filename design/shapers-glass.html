<title>Shapers Liquid Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#050304; --screen:#070304; --frame:#000; --frame-edge:#1a1f5c;
  --blob1:rgba(25,25,112,.95); --blob2:rgba(8,10,48,.95); --blob3:rgba(212,178,111,.22); --blob4:rgba(25,25,112,.65);
  --ink:#F3EEE6; --ink-2:rgba(243,238,230,.74); --ink-3:rgba(243,238,230,.52);
  --glass:rgba(255,255,255,.05); --glass-on:rgba(212,178,111,.16); --edge:rgba(255,255,255,.06);
  --hi:rgba(255,236,200,.28); --sheen:rgba(255,255,255,.1); --shadow:rgba(0,0,0,.55);
  --rim:linear-gradient(135deg,rgba(232,200,130,.95),rgba(70,90,210,.55) 30%,rgba(25,25,112,.1) 55%,rgba(70,90,210,.5) 80%,rgba(232,200,130,.7));
  --glow:0 0 18px rgba(50,70,190,.45),0 0 1px rgba(232,200,130,.6);
  --accent:#D4B26F; --accent-ink:#0B0F2E; --accent-2:#E0C07F;
  --accent-glow:0 0 18px rgba(212,178,111,.55),0 0 42px rgba(50,70,190,.45);
  --btn-top:#E6C98C; --btn-bot:#C9A35C; --btn-ink:#0B0F2E;
  --tile:rgba(25,25,112,.6); --tile-edge:rgba(212,178,111,.45);
  --v1:#03040C; --v2:#191970; --v3:#0A0E2E; --vglow:rgba(212,178,111,.45);
  --track:rgba(255,255,255,.12);
  --av1:#D4B26F; --av2:#E5DDD0; --av3:#6F7FD1;
  --ui:-apple-system,"SF Pro Text","SF Pro Display","Figtree",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
}
:root[data-palette="rose"]{
  color-scheme: light;
  --ground:#E4DDDA; --screen:#EBE6E4; --frame:#2E2624; --frame-edge:#8f807a;
  --blob1:rgba(210,151,159,.85); --blob2:rgba(181,165,158,.9); --blob3:rgba(210,151,159,.55); --blob4:rgba(181,165,158,.7);
  --ink:#3A2E2B; --ink-2:rgba(58,46,43,.78); --ink-3:rgba(58,46,43,.58);
  --glass:rgba(255,255,255,.42); --glass-on:rgba(255,255,255,.7); --edge:rgba(255,255,255,.75);
  --hi:rgba(255,255,255,.9); --sheen:rgba(255,255,255,.45); --shadow:rgba(90,66,62,.16);
  --rim:none; --glow:0 0 0 transparent; --accent-glow:0 8px 20px rgba(90,66,62,.16);
  --accent:#D2979F; --accent-ink:#3A1B21; --accent-2:#9E5A64;
  --btn-top:#3F3230; --btn-bot:#2F2523; --btn-ink:#EBE6E4;
  --tile:rgba(210,151,159,.4); --tile-edge:rgba(255,255,255,.7);
  --v1:#8E7C76; --v2:#D2979F; --v3:#B5A59E; --vglow:rgba(235,230,228,.7);
  --track:rgba(58,46,43,.14);
  --av1:#D2979F; --av2:#B5A59E; --av3:#9E5A64;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);padding-inline:16px;padding-block:28px 48px;margin:0;transition:background-color .5s,color .5s}
.intro{max-width:760px;margin:0 auto 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.intro h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.intro p{margin:0;color:var(--ink-3);font-size:13px}

.switch{display:flex;padding:4px;border-radius:99px;gap:2px}
.switch button{border:0;background:none;font:inherit;color:var(--ink-2);font-size:13px;font-weight:600;padding:8px 14px 8px 10px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .3s,color .3s}
.switch button.on{background:var(--glass-on);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi)}
.dots{display:flex}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ground);margin-left:-5px;display:block}
.dots i:first-child{margin-left:0}

.stage{display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
.phone{width:360px;max-width:100%;height:760px;border-radius:52px;padding:10px;background:var(--frame);box-shadow:0 0 0 1.5px var(--frame-edge),0 30px 80px var(--shadow),var(--glow)}
.pill,.give,.btn{box-shadow:var(--accent-glow)}
.tab.on{text-shadow:0 0 12px rgba(212,178,111,.35)}
:root[data-palette="rose"] .tab.on{text-shadow:none}
.screen{position:relative;height:100%;border-radius:43px;overflow:hidden;background:var(--screen);isolation:isolate;color:var(--ink);transition:background-color .5s}
.screen::before{content:"";position:absolute;inset:-20%;z-index:-1;
  background:
    radial-gradient(38% 30% at 85% 12%, var(--blob1), transparent 70%),
    radial-gradient(45% 35% at 5% 45%, var(--blob2), transparent 70%),
    radial-gradient(30% 22% at 80% 70%, var(--blob3), transparent 70%),
    radial-gradient(40% 30% at 20% 95%, var(--blob4), transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.05)}}

.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 1px rgba(255,255,255,.06),0 10px 30px var(--shadow),var(--glow);
  transition:background-color .5s,border-color .5s,box-shadow .5s}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--rim);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,var(--sheen),transparent 35%,transparent 70%,rgba(255,255,255,.06))}

.status{height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-size:15px;font-weight:600}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:32px;border-radius:20px;background:#000;z-index:6}
.sicons{display:flex;gap:5px;align-items:center}
.sicons svg{display:block}

.scroll{position:absolute;inset:50px 0 0;overflow-y:auto;padding:6px 18px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}
.hello small{display:block;color:var(--ink-3);font-size:13px;font-weight:500}
.hello strong{font-size:30px;font-weight:700;letter-spacing:-.02em}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--accent-2)}

.live{border-radius:30px;padding:10px;margin-bottom:18px}
.video{position:relative;height:168px;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,var(--v1) 0%,var(--v2) 45%,var(--v3) 100%)}
.video::before,.player::before{content:"";position:absolute;inset:0;background:
  radial-gradient(40% 55% at 50% 110%, var(--vglow), transparent 70%),
  repeating-linear-gradient(100deg, rgba(255,255,255,.06) 0 2px, transparent 2px 38px)}
.pill{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent)}
.pill b{width:6px;height:6px;border-radius:50%;background:var(--accent-ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.viewers{position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:600;color:#fff}
.live-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 6px 4px}
.live-meta h3{margin:0;font-size:17px;font-weight:600}
.live-meta p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.btn{border:0;font:inherit;cursor:pointer;color:var(--btn-ink);background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));font-weight:600;font-size:14px;padding:10px 16px;border-radius:99px;box-shadow:inset 0 -2px 4px rgba(0,0,0,.12),var(--accent-glow);white-space:nowrap}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);font-weight:500}
.q span{width:58px;height:58px;border-radius:20px;display:grid;place-items:center}
.q svg{stroke:var(--accent-2)}

.sect{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sect h4{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sect a{color:var(--accent-2);font-size:13px;text-decoration:none;font-weight:500}

.cont{display:flex;gap:12px;align-items:center;border-radius:24px;padding:10px;margin-bottom:22px}
.thumb{width:74px;height:74px;border-radius:16px;flex:none;background:linear-gradient(145deg,var(--v2),var(--v1));display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:24px;color:var(--accent)}
:root[data-palette="rose"] .thumb{color:#fff}
.cont h5{margin:0;font-size:15px;font-weight:600}
.cont p{margin:2px 0 8px;color:var(--ink-3);font-size:12.5px}
.bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:62%;background:var(--accent);border-radius:4px}

.events{display:grid;gap:10px}
.ev{display:flex;gap:12px;align-items:center;border-radius:22px;padding:10px 14px 10px 10px}
.date{width:52px;height:56px;border-radius:15px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tile);border:1px solid var(--tile-edge)}
.date small{font-size:10px;letter-spacing:.1em;color:var(--accent-2);font-weight:700}
.date b{font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ev div{flex:1;min-width:0}
.ev h5{margin:0;font-size:15px;font-weight:600}
.ev p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.price{font-size:13px;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums}

.dock{position:absolute;left:14px;right:14px;bottom:22px;display:flex;gap:10px;align-items:center;z-index:5}
.tabs{flex:1;display:flex;justify-content:space-between;border-radius:99px;padding:6px}
.tab{flex:1;border:0;background:none;color:var(--ink-2);font:inherit;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:99px;cursor:pointer;transition:background .25s,color .25s}
.tab svg{stroke:currentColor}
.tab.on{color:var(--accent-2);background:var(--glass-on);box-shadow:inset 0 1px 0 var(--hi)}
.search{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center}
.search svg{stroke:var(--ink)}

.player{position:relative;height:220px;margin:0 -18px 14px;background:linear-gradient(170deg,var(--v1),var(--v2) 45%,var(--v3))}
.player .pill{top:14px;left:18px}
.title{margin:0 2px 14px}
.title h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.title p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.seg{display:flex;border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;padding:8px 0;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--glass-on);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi)}
.verse{border-radius:24px;padding:16px 18px;margin-bottom:16px}
.verse small{font-size:11px;letter-spacing:.12em;color:var(--accent-2);font-weight:700}
.verse p{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;margin:6px 0 0}
.chat{display:grid;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg i{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#2a1a1a}
.bub{border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:13.5px;line-height:1.35}
.bub b{display:block;font-size:11px;color:var(--accent-2);font-weight:600;margin-bottom:1px}
.composer{position:absolute;left:14px;right:14px;bottom:22px;display:flex;gap:10px;z-index:5}
.field{flex:1;border-radius:99px;padding:15px 18px;color:var(--ink-3);font-size:14px}
.give{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--accent-glow)}
.give svg{stroke:var(--accent-ink)}
.caption{text-align:center;color:var(--ink-3);font-size:12px;margin-top:12px;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.screen::before,.pill b{animation:none}*{transition:none!important}}
</style>

<script>
(function(){
  var root=document.documentElement;
  var btns=document.querySelectorAll('.switch button');
  function apply(p){
    if(p==='rose') root.setAttribute('data-palette','rose'); else root.removeAttribute('data-palette');
    btns.forEach(function(b){var on=b.dataset.p===p;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
    try{localStorage.setItem('shapers-palette',p)}catch(e){}
  }
  var saved=null; try{saved=localStorage.getItem('shapers-palette')}catch(e){}
  apply(saved==='rose'?'rose':'crimson');
  btns.forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.p)})});
  document.querySelectorAll('.tabs,.seg').forEach(function(group){
    group.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      group.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
    });
  });
  document.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})});
})();
</script>
