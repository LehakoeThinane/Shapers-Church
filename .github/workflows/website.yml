name: Website

# Builds the public website from the live API and deploys it to Azure Static Web Apps.
# Runs when the website code changes on main, every hour, when the API reports new content (repository dispatch),
# or by hand. Until the Azure resource exists (secret AZURE_STATIC_WEB_APPS_API_TOKEN), it builds but doesn't deploy.

on:
  push:
    branches: [main]
    paths: ['web/**', 'packages/tokens/**', 'packages/api-client/**', '.github/workflows/website.yml']
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [site-rebuild]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
      HAS_API_URL: ${{ vars.WEBSITE_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build from the live API
        if: env.HAS_API_URL == 'true'
        run: pnpm --filter @shapers/web build
        env:
          API_URL: ${{ vars.WEBSITE_API_URL }}
          PUBLIC_API_URL: ${{ vars.WEBSITE_API_URL }}
          SITE_URL: ${{ vars.WEBSITE_URL || 'https://shaperschurch.com' }}

      - name: Not configured yet
        if: env.HAS_API_URL != 'true' || env.HAS_DEPLOY_TOKEN != 'true'
        run: echo "Set the WEBSITE_API_URL variable and the AZURE_STATIC_WEB_APPS_API_TOKEN secret to deploy. See README > Public website."

      - name: Deploy to Azure Static Web Apps
        if: env.HAS_API_URL == 'true' && env.HAS_DEPLOY_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
