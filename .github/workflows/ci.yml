name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore Shapers.slnx

      - name: Build (warnings are errors)
        run: dotnet build Shapers.slnx --no-restore -c Release

      - name: OpenAPI document is up to date
        working-directory: .
        run: git diff --exit-code -- packages/api-client/openapi.json

      # Every project under tests/ runs, so a new module's tests can't be left out. The integration tests
      # run in the next step. Each project runs even if an earlier one fails; the step fails at the end.
      - name: Unit and architecture tests
        run: |
          failed=()
          while IFS= read -r project; do
            echo "::group::$project"
            dotnet test --no-build -c Release --project "$project" || failed+=("$project")
            echo "::endgroup::"
          done < <(find tests -name '*.csproj' ! -name 'Shapers.IntegrationTests.csproj' | sort)
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Tests failed in %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test --no-build -c Release --project tests/Shapers.IntegrationTests

      - name: Vulnerable packages
        run: |
          dotnet list Shapers.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  web:
    name: Web, mobile and shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tokens are generated and meet contrast minimums
        run: |
          pnpm --filter @shapers/tokens check
          pnpm --filter @shapers/tokens test

      - name: API client matches the OpenAPI document
        run: pnpm --filter @shapers/api-client check

      - name: No hard-coded colours
        run: pnpm check:colours

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Build admin portal
        run: pnpm --filter @shapers/admin build

      - name: Build website without the API (checks it compiles)
        run: pnpm --filter @shapers/web build
        env:
          ALLOW_OFFLINE_BUILD: 1
          API_URL: http://127.0.0.1:9

      - name: Bundle member app (iOS and Android JavaScript)
        run: pnpm --filter @shapers/mobile exec expo export --platform ios --platform android --output-dir ${{ runner.temp }}/expo-export
        env:
          CI: 1

      - name: Dependency audit
        run: pnpm audit --audit-level high
